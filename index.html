<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수입축산물 검역중량 대시보드</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #151312; }
  * { box-sizing: border-box; }
  body { font-family: 'Pretendard','Malgun Gothic','Noto Sans KR',sans-serif; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #332c29; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect, useMemo, useRef } = React;
const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, Cell } = Recharts;

const COLORS = {
  bg: "#151312", panel: "#1d1a19", panelBorder: "#2b2624", panelBorder2: "#332c29",
  amber: "#d98b3f", amberSoft: "#e8b877", cream: "#f2ead9", mute: "#8f857a",
  sage: "#6f9482", rust: "#c2695f", head: "#141211",
};
const SERIES_PALETTE = ["#d98b3f", "#5c8f7a", "#4f8fb8", "#b0a25c", "#a06a9c", "#c2695f", "#8b7bb0", "#5fa88a", "#e0985a", "#7ea0c4"];

function n(v) { return Math.round(v).toLocaleString(); }
function fmtShort(v) { return Math.abs(v) >= 10000 ? (v / 10000).toFixed(1) + "만" : Math.round(v).toLocaleString(); }
function pct(v) { if (v === null) return "—"; const s = v > 0 ? "+" : ""; return `${s}${v.toFixed(1)}%`; }

const DIM_LABEL = { country: "국가", part: "부위", year: "연도", month: "월" };
const DIM_OPTIONS = [["country", "국가"], ["part", "부위"], ["year", "연도"], ["month", "월"]];

function downloadXlsx(aoa, filename, sheetName) {
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName || "Sheet1");
  XLSX.writeFile(wb, filename);
}

function App() {
  const [db, setDb] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    fetch("./data/master_flat.json", { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error("데이터 파일을 불러오지 못했습니다 (" + r.status + ")"); return r.json(); })
      .then(setDb)
      .catch(e => setErr(e.message));
  }, []);

  if (err) {
    return <div style={{ background: COLORS.bg, color: COLORS.rust, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>{err}</div>;
  }
  if (!db) {
    return <div style={{ background: COLORS.bg, color: COLORS.mute, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>데이터를 불러오는 중...</div>;
  }
  return <Dashboard db={db} />;
}

function Dashboard({ db }) {
  const META = db.meta;
  const YEAR_BASE = META.yearBase;
  const FLAT = db.flat;

  const ROWS = useMemo(() => {
    const rows = [];
    for (let idx = 0; idx < FLAT.length; idx += 7) {
      rows.push([FLAT[idx] + YEAR_BASE, FLAT[idx + 1], FLAT[idx + 2], FLAT[idx + 3], FLAT[idx + 4], FLAT[idx + 5], FLAT[idx + 6] / 10]);
    }
    return rows;
  }, [FLAT, YEAR_BASE]);

  const { ALL_YM, YM_MIN, YM_MAX } = useMemo(() => {
    const set = new Set();
    ROWS.forEach(r => set.add(r[0] * 100 + r[1]));
    const all = [...set].sort((a, b) => a - b);
    return { ALL_YM: all, YM_MIN: all[0], YM_MAX: all[all.length - 1] };
  }, [ROWS]);
  const ymLabel = (ym) => `${Math.floor(ym / 100)}년 ${ym % 100}월`;

  function dimValue(r, dimKey) {
    if (dimKey === "country") return META.국가[r[5]];
    if (dimKey === "part") return META.부위[r[4]];
    if (dimKey === "year") return String(r[0]);
    return `${r[1]}월`;
  }
  function monthNum(label) { return parseInt(label, 10); }

  const [mainTab, setMainTab] = useState("table");
  const [chartSub, setChartSub] = useState("group");

  const [meat, setMeat] = useState(META.품명[2] || META.품명[0]);
  const [ice, setIce] = useState("전체");
  const [countryFilter, setCountryFilter] = useState([]);
  const [partFilter, setPartFilter] = useState([]);

  const [ymStart, setYmStart] = useState(YM_MIN);
  const [ymEnd, setYmEnd] = useState(YM_MAX);
  const onYmStart = (v) => { const val = +v; setYmStart(val); if (val > ymEnd) setYmEnd(val); };
  const onYmEnd = (v) => { const val = +v; setYmEnd(val); if (val < ymStart) setYmStart(val); };

  const [rowDim, setRowDim] = useState("country");
  const [colDim, setColDim] = useState("year");
  const [displayMode, setDisplayMode] = useState("abs");

  const [groupBy, setGroupBy] = useState("year");
  const [sortDesc, setSortDesc] = useState(true);

  const [overlayDim, setOverlayDim] = useState("year");
  const [overlayXAxis, setOverlayXAxis] = useState("month");
  const [overlayYearCtx, setOverlayYearCtx] = useState(Math.floor(YM_MAX / 100));
  const [overlaySel, setOverlaySel] = useState({ dim: "year", list: [] });

  const meatIdx = META.품명.indexOf(meat);

  const baseFilteredRows = useMemo(() => {
    return ROWS.filter(r => {
      const [y, m, pIdx, iIdx, rIdx, nIdx] = r;
      if (pIdx !== meatIdx) return false;
      if (ice !== "전체" && META.구분[iIdx] !== ice) return false;
      if (countryFilter.length && !countryFilter.includes(META.국가[nIdx])) return false;
      if (partFilter.length && !partFilter.includes(META.부위[rIdx])) return false;
      const ym = y * 100 + m;
      if (ym < ymStart || ym > ymEnd) return false;
      return true;
    });
  }, [ROWS, meatIdx, ice, countryFilter, partFilter, ymStart, ymEnd]);

  const years = useMemo(() => [...new Set(baseFilteredRows.map(r => r[0]))].sort((a, b) => a - b), [baseFilteredRows]);
  const grandTotalAll = useMemo(() => baseFilteredRows.reduce((s, r) => s + r[6], 0), [baseFilteredRows]);

  const toggleFilter = (list, setList, value) => setList(list.includes(value) ? list.filter(x => x !== value) : [...list, value]);

  function sortLabels(dimKey, labels, totalsMap) {
    if (dimKey === "year") return [...labels].sort((a, b) => +a - +b);
    if (dimKey === "month") return [...labels].sort((a, b) => monthNum(a) - monthNum(b));
    return [...labels].sort((a, b) => (totalsMap[b] || 0) - (totalsMap[a] || 0));
  }

  const { rowLabels, colLabels, matrix, rowTotals, colTotals, grandTotal } = useMemo(() => {
    const rowTotalsRaw = {}, colTotalsRaw = {};
    const matrix = {};
    let grandTotal = 0;
    baseFilteredRows.forEach(r => {
      const rl = dimValue(r, rowDim);
      const cl = dimValue(r, colDim);
      const ton = r[6];
      rowTotalsRaw[rl] = (rowTotalsRaw[rl] || 0) + ton;
      colTotalsRaw[cl] = (colTotalsRaw[cl] || 0) + ton;
      if (!matrix[rl]) matrix[rl] = {};
      matrix[rl][cl] = (matrix[rl][cl] || 0) + ton;
      grandTotal += ton;
    });
    const rowLabels = sortLabels(rowDim, Object.keys(rowTotalsRaw), rowTotalsRaw);
    const colLabels = sortLabels(colDim, Object.keys(colTotalsRaw), colTotalsRaw);
    return { rowLabels, colLabels, matrix, rowTotals: rowTotalsRaw, colTotals: colTotalsRaw, grandTotal };
  }, [baseFilteredRows, rowDim, colDim]);

  function cellDisplay(rowLabel, colLabel, colIdx) {
    const val = matrix[rowLabel]?.[colLabel] || 0;
    if (displayMode === "abs") return { text: val ? n(val) : "-", raw: val };
    const prevCol = colLabels[colIdx - 1];
    if (!prevCol) return { text: "—", raw: null };
    const prevVal = matrix[rowLabel]?.[prevCol] || 0;
    if (prevVal === 0) return { text: val > 0 ? "신규" : "—", raw: null };
    const growth = ((val - prevVal) / prevVal) * 100;
    return { text: pct(growth), raw: growth };
  }

  const onRowDimChange = (v) => { if (v === colDim) setColDim(rowDim); setRowDim(v); };
  const onColDimChange = (v) => { if (v === rowDim) setRowDim(colDim); setColDim(v); };

  function exportTableXlsx() {
    const header = [DIM_LABEL[rowDim], ...colLabels, "총합계"];
    const body = rowLabels.map(rl => [rl, ...colLabels.map(cl => Math.round((matrix[rl]?.[cl] || 0) * 100) / 100), Math.round(rowTotals[rl] * 100) / 100]);
    const footer = ["총합계", ...colLabels.map(cl => Math.round((colTotals[cl] || 0) * 100) / 100), Math.round(grandTotal * 100) / 100];
    downloadXlsx([header, ...body, footer], `${meat}_${DIM_LABEL[rowDim]}x${DIM_LABEL[colDim]}_검역중량.xlsx`, "피벗표");
  }

  const grouped = useMemo(() => {
    const map = new Map();
    baseFilteredRows.forEach(r => { let key = dimValue(r, groupBy); map.set(key, (map.get(key) || 0) + r[6]); });
    let arr = [...map.entries()].map(([key, v]) => ({ key, v }));
    if (groupBy === "year") arr.sort((a, b) => +a.key - +b.key);
    else if (groupBy === "month") arr.sort((a, b) => monthNum(a.key) - monthNum(b.key));
    else arr.sort((a, b) => sortDesc ? b.v - a.v : a.v - b.v);
    return arr;
  }, [baseFilteredRows, groupBy, sortDesc]);
  const isTimeGroup = groupBy === "year" || groupBy === "month";

  function exportGroupXlsx() {
    const header = [DIM_LABEL[groupBy], "검역중량(톤)"];
    const body = grouped.map(g => [g.key, Math.round(g.v * 100) / 100]);
    downloadXlsx([header, ...body], `${meat}_${DIM_LABEL[groupBy]}별_검역중량.xlsx`, "그룹비교");
  }

  const overlayCandidates = useMemo(() => {
    if (overlayDim === "year") return years.map(String);
    if (overlayDim === "country") {
      const totals = {};
      baseFilteredRows.forEach(r => { const k = META.국가[r[5]]; totals[k] = (totals[k] || 0) + r[6]; });
      return Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
    }
    const totals = {};
    baseFilteredRows.forEach(r => { const k = META.부위[r[4]]; totals[k] = (totals[k] || 0) + r[6]; });
    return Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
  }, [overlayDim, baseFilteredRows, years]);

  const effectiveXAxis = overlayDim === "year" ? "month" : overlayXAxis;
  const currentOverlayList = overlaySel.dim === overlayDim && overlaySel.list.length
    ? overlaySel.list.filter(v => overlayCandidates.includes(v))
    : overlayCandidates.slice(0, overlayDim === "year" ? Math.min(3, overlayCandidates.length) : 5);

  const toggleOverlay = (v) => {
    const list = currentOverlayList.includes(v) ? currentOverlayList.filter(x => x !== v) : [...currentOverlayList, v];
    setOverlaySel({ dim: overlayDim, list });
  };
  const selectAllOverlay = () => setOverlaySel({ dim: overlayDim, list: [...overlayCandidates] });
  const clearOverlay = () => setOverlaySel({ dim: overlayDim, list: [] });

  const overlayData = useMemo(() => {
    const xLabels = effectiveXAxis === "month" ? Array.from({ length: 12 }, (_, i) => `${i + 1}월`) : years.map(String);
    const base = xLabels.map(x => ({ x }));
    let rowsForOverlay = baseFilteredRows;
    if (overlayDim !== "year" && effectiveXAxis === "month") rowsForOverlay = rowsForOverlay.filter(r => r[0] === overlayYearCtx);
    currentOverlayList.forEach(val => {
      const bucket = {};
      rowsForOverlay.forEach(r => {
        const seriesVal = overlayDim === "year" ? String(r[0]) : dimValue(r, overlayDim);
        if (seriesVal !== val) return;
        const xVal = effectiveXAxis === "month" ? `${r[1]}월` : String(r[0]);
        bucket[xVal] = (bucket[xVal] || 0) + r[6];
      });
      base.forEach(row => { row[val] = Math.round((bucket[row.x] || 0) * 10) / 10; });
    });
    return base;
  }, [baseFilteredRows, overlayDim, effectiveXAxis, currentOverlayList, overlayYearCtx, years]);

  function exportOverlayXlsx() {
    const header = ["구분", ...currentOverlayList];
    const body = overlayData.map(row => [row.x, ...currentOverlayList.map(v => row[v] ?? 0)]);
    downloadXlsx([header, ...body], `${meat}_${DIM_LABEL[overlayDim]}겹쳐보기_검역중량.xlsx`, "겹쳐보기");
  }

  return (
    <div style={{ background: COLORS.bg, minHeight: "100vh", padding: "24px 16px 40px", color: COLORS.cream }}>
      <div style={{ maxWidth: 1120, margin: "0 auto" }}>

        <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 3 }}>
          <span style={{ fontSize: 11.5, letterSpacing: "0.13em", color: COLORS.mute, fontWeight: 700 }}>2019 – 2026 수입축산물 검역중량</span>
        </div>
        <h1 style={{ fontSize: 23, fontWeight: 800, margin: "5px 0 16px", letterSpacing: "-0.01em" }}>{meat} 검역중량 (톤)</h1>

        <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
          {META.품명.map(p => (
            <button key={p} onClick={() => setMeat(p)}
              style={{ padding: "7px 14px", borderRadius: 8, fontSize: 13, fontWeight: 700, cursor: "pointer",
                border: `1px solid ${p === meat ? COLORS.amber : COLORS.panelBorder}`,
                background: p === meat ? "rgba(217,139,63,0.14)" : COLORS.panel,
                color: p === meat ? COLORS.amber : COLORS.mute }}>{p}</button>
          ))}
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
          <ChipGroup label="구분" options={["전체", "냉동", "냉장"]} value={ice} onChange={setIce} />
          <HoverMultiPicker label="국가" options={META.국가} selected={countryFilter} onToggle={v => toggleFilter(countryFilter, setCountryFilter, v)} onSelectAll={() => setCountryFilter([...META.국가])} onClear={() => setCountryFilter([])} />
          <HoverMultiPicker label="부위" options={META.부위.filter(p => p !== "-")} selected={partFilter} onToggle={v => toggleFilter(partFilter, setPartFilter, v)} onSelectAll={() => setPartFilter(META.부위.filter(p => p !== "-"))} onClear={() => setPartFilter([])} />
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center", marginBottom: 14 }}>
          <span style={{ fontSize: 11, color: COLORS.mute }}>기간</span>
          <HoverAxisPicker label="시작" value={ymStart} onChange={onYmStart} options={ALL_YM.map(ym => [ym, ymLabel(ym)])} />
          <span style={{ color: COLORS.mute }}>–</span>
          <HoverAxisPicker label="종료" value={ymEnd} onChange={onYmEnd} options={ALL_YM.map(ym => [ym, ymLabel(ym)])} />
          <button onClick={() => { setYmStart(YM_MIN); setYmEnd(YM_MAX); }}
            style={{ fontSize: 11, color: COLORS.mute, background: "none", border: `1px solid ${COLORS.panelBorder}`, borderRadius: 6, padding: "4px 8px", cursor: "pointer" }}>전체기간</button>
        </div>

        <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 10, padding: "12px 16px", marginBottom: 14, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontSize: 11, color: COLORS.mute }}>
            {meat} · {ice}{countryFilter.length ? ` · 국가 ${countryFilter.length}개` : ""}{partFilter.length ? ` · 부위 ${partFilter.length}개` : ""} · {ymLabel(ymStart)}~{ymLabel(ymEnd)}
          </div>
          <div style={{ fontSize: 18, fontWeight: 800, color: COLORS.amber, fontFamily: "ui-monospace,monospace" }}>합계 {n(grandTotalAll)} 톤</div>
        </div>

        <div style={{ display: "flex", gap: 4, marginBottom: 14, borderBottom: `1px solid ${COLORS.panelBorder}` }}>
          <SheetTab active={mainTab === "table"} onClick={() => setMainTab("table")} label="표" />
          <SheetTab active={mainTab === "chart"} onClick={() => setMainTab("chart")} label="차트" />
        </div>

        {mainTab === "table" && (
          <React.Fragment>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center", marginBottom: 12 }}>
              <HoverAxisPicker label="행" value={rowDim} onChange={onRowDimChange} options={DIM_OPTIONS} />
              <HoverAxisPicker label="열" value={colDim} onChange={onColDimChange} options={DIM_OPTIONS} />
              <div style={{ display: "flex", gap: 4, marginLeft: "auto" }}>
                <ToggleBtn active={displayMode === "abs"} onClick={() => setDisplayMode("abs")} label="실수치(톤)" />
                <ToggleBtn active={displayMode === "yoy"} onClick={() => setDisplayMode("yoy")} label="전 열 대비 증감률" />
                <button onClick={exportTableXlsx} style={{ padding: "6px 12px", borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: "pointer", border: `1px solid ${COLORS.sage}`, background: "rgba(111,148,130,0.14)", color: COLORS.sage }}>⬇ 엑셀 다운로드</button>
              </div>
            </div>
            <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 12, overflow: "hidden" }}>
              <div style={{ overflowX: "auto", maxHeight: 560, overflowY: "auto" }}>
                <table style={{ borderCollapse: "collapse", fontSize: 12.5, width: "100%" }}>
                  <thead>
                    <tr>
                      <th style={{ ...thStyle, position: "sticky", left: 0, top: 0, zIndex: 3, background: COLORS.head, minWidth: 108 }}>{DIM_LABEL[rowDim]}</th>
                      {colLabels.map(cl => <th key={cl} style={{ ...thStyle, position: "sticky", top: 0, zIndex: 2, background: COLORS.head, textAlign: "right", minWidth: 84 }}>{cl}</th>)}
                      <th style={{ ...thStyle, position: "sticky", top: 0, right: 0, zIndex: 3, background: "#1a1613", textAlign: "right", minWidth: 96, color: COLORS.amberSoft }}>총합계</th>
                    </tr>
                  </thead>
                  <tbody>
                    {rowLabels.map(rl => (
                      <tr key={rl} style={{ borderTop: `1px solid ${COLORS.panelBorder}` }}>
                        <td style={{ ...tdStyle, position: "sticky", left: 0, background: COLORS.panel, fontWeight: 700, zIndex: 1 }}>{rl}</td>
                        {colLabels.map((cl, ci) => {
                          const { text, raw } = cellDisplay(rl, cl, ci);
                          const color = displayMode === "yoy" ? (raw === null ? COLORS.mute : raw > 0 ? COLORS.sage : raw < 0 ? COLORS.rust : COLORS.mute) : COLORS.cream;
                          return <td key={cl} style={{ ...tdStyle, textAlign: "right", fontFamily: "ui-monospace,monospace", color }}>{text}</td>;
                        })}
                        <td style={{ ...tdStyle, textAlign: "right", fontFamily: "ui-monospace,monospace", fontWeight: 700, color: COLORS.amberSoft, position: "sticky", right: 0, background: "#1a1613" }}>{n(rowTotals[rl])}</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr style={{ borderTop: `2px solid ${COLORS.panelBorder2}` }}>
                      <td style={{ ...tdStyle, position: "sticky", left: 0, background: "#1a1613", fontWeight: 800 }}>총합계</td>
                      {colLabels.map(cl => <td key={cl} style={{ ...tdStyle, textAlign: "right", fontFamily: "ui-monospace,monospace", fontWeight: 800, color: COLORS.amberSoft }}>{n(colTotals[cl] || 0)}</td>)}
                      <td style={{ ...tdStyle, textAlign: "right", fontFamily: "ui-monospace,monospace", fontWeight: 800, color: COLORS.amber, position: "sticky", right: 0, background: "#1a1613" }}>{n(grandTotal)}</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
          </React.Fragment>
        )}

        {mainTab === "chart" && (
          <React.Fragment>
            <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
              <SubTab active={chartSub === "group"} onClick={() => setChartSub("group")} label="그룹 비교" />
              <SubTab active={chartSub === "overlay"} onClick={() => setChartSub("overlay")} label="겹쳐보기" />
            </div>

            {chartSub === "group" && (
              <React.Fragment>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8, flexWrap: "wrap", gap: 8 }}>
                  <HoverAxisPicker label="기준" value={groupBy} onChange={setGroupBy} options={DIM_OPTIONS} />
                  <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                    {!isTimeGroup && (
                      <button onClick={() => setSortDesc(!sortDesc)} style={{ fontSize: 11.5, color: COLORS.mute, background: "none", border: "none", cursor: "pointer" }}>⇅ {sortDesc ? "내림차순" : "오름차순"}</button>
                    )}
                    <button onClick={exportGroupXlsx} style={{ padding: "6px 12px", borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: "pointer", border: `1px solid ${COLORS.sage}`, background: "rgba(111,148,130,0.14)", color: COLORS.sage }}>⬇ 엑셀 다운로드</button>
                  </div>
                </div>
                <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 12, padding: "14px 16px 6px" }}>
                  <ResponsiveContainer width="100%" height={isTimeGroup ? 300 : Math.min(560, Math.max(200, grouped.length * 26))}>
                    {isTimeGroup ? (
                      <LineChart data={grouped} margin={{ top: 8, right: 16, left: -6, bottom: 0 }}>
                        <CartesianGrid strokeDasharray="3 3" stroke={COLORS.panelBorder} />
                        <XAxis dataKey="key" tick={{ fill: COLORS.mute, fontSize: 10.5 }} axisLine={{ stroke: COLORS.panelBorder }} tickLine={false} />
                        <YAxis tick={{ fill: COLORS.mute, fontSize: 10.5 }} axisLine={false} tickLine={false} tickFormatter={fmtShort} />
                        <Tooltip contentStyle={{ background: "#0f0d0c", border: `1px solid ${COLORS.panelBorder}`, borderRadius: 8, fontSize: 12 }} formatter={(v) => [n(v) + " 톤", "검역중량"]} labelStyle={{ color: COLORS.cream }} />
                        <Line type="monotone" dataKey="v" stroke={COLORS.amber} strokeWidth={2.4} dot={grouped.length < 40 ? { r: 3, fill: COLORS.amber } : false} />
                      </LineChart>
                    ) : (
                      <BarChart data={grouped} layout="vertical" margin={{ left: 4, right: 24 }}>
                        <XAxis type="number" tick={{ fill: COLORS.mute, fontSize: 10 }} axisLine={false} tickLine={false} tickFormatter={fmtShort} />
                        <YAxis type="category" dataKey="key" width={70} tick={{ fill: COLORS.cream, fontSize: 11 }} axisLine={false} tickLine={false} />
                        <Tooltip contentStyle={{ background: "#0f0d0c", border: `1px solid ${COLORS.panelBorder}`, borderRadius: 8, fontSize: 12 }} formatter={(v) => [n(v) + " 톤", "검역중량"]} />
                        <Bar dataKey="v" radius={[0, 4, 4, 0]}>
                          {grouped.map((_, idx) => <Cell key={idx} fill={SERIES_PALETTE[idx % SERIES_PALETTE.length]} />)}
                        </Bar>
                      </BarChart>
                    )}
                  </ResponsiveContainer>
                </div>
              </React.Fragment>
            )}

            {chartSub === "overlay" && (
              <React.Fragment>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center", marginBottom: 10 }}>
                  <HoverAxisPicker label="비교기준" value={overlayDim} onChange={(v) => { setOverlayDim(v); setOverlaySel({ dim: v, list: [] }); }} options={[["year", "연도"], ["country", "국가"], ["part", "부위"]]} />
                  {overlayDim !== "year" && <HoverAxisPicker label="X축" value={overlayXAxis} onChange={setOverlayXAxis} options={[["month", "월별"], ["year", "연도별"]]} />}
                  {overlayDim !== "year" && effectiveXAxis === "month" && <HoverAxisPicker label="기준연도" value={overlayYearCtx} onChange={setOverlayYearCtx} options={years.map(y => [y, `${y}년`])} />}
                  <button onClick={exportOverlayXlsx} style={{ padding: "6px 12px", borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: "pointer", border: `1px solid ${COLORS.sage}`, background: "rgba(111,148,130,0.14)", color: COLORS.sage, marginLeft: "auto" }}>⬇ 엑셀 다운로드</button>
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10, alignItems: "center" }}>
                  <span style={{ fontSize: 11, color: COLORS.mute }}>겹쳐볼 {DIM_LABEL[overlayDim]} 선택:</span>
                  <button onClick={selectAllOverlay} style={{ fontSize: 11, color: COLORS.sage, background: "none", border: "none", cursor: "pointer", fontWeight: 700 }}>전체 선택</button>
                  <span style={{ color: COLORS.panelBorder2 }}>|</span>
                  <button onClick={clearOverlay} style={{ fontSize: 11, color: COLORS.rust, background: "none", border: "none", cursor: "pointer", fontWeight: 700 }}>전체 해제</button>
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
                  {overlayCandidates.map(v => (
                    <button key={v} onClick={() => toggleOverlay(v)}
                      style={{ padding: "5px 11px", borderRadius: 7, fontSize: 12, fontWeight: 700, cursor: "pointer",
                        border: `1px solid ${currentOverlayList.includes(v) ? COLORS.amber : COLORS.panelBorder}`,
                        background: currentOverlayList.includes(v) ? "rgba(217,139,63,0.14)" : COLORS.panel,
                        color: currentOverlayList.includes(v) ? COLORS.amber : COLORS.mute }}>{v}</button>
                  ))}
                </div>
                <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 12, padding: "14px 16px 6px" }}>
                  <ResponsiveContainer width="100%" height={320}>
                    <LineChart data={overlayData} margin={{ top: 8, right: 16, left: -6, bottom: 0 }}>
                      <CartesianGrid strokeDasharray="3 3" stroke={COLORS.panelBorder} />
                      <XAxis dataKey="x" tick={{ fill: COLORS.mute, fontSize: 11 }} axisLine={{ stroke: COLORS.panelBorder }} tickLine={false} />
                      <YAxis tick={{ fill: COLORS.mute, fontSize: 10.5 }} axisLine={false} tickLine={false} tickFormatter={fmtShort} />
                      <Tooltip contentStyle={{ background: "#0f0d0c", border: `1px solid ${COLORS.panelBorder}`, borderRadius: 8, fontSize: 12 }} formatter={(v) => n(v) + " 톤"} labelStyle={{ color: COLORS.cream }} />
                      <Legend wrapperStyle={{ fontSize: 12 }} />
                      {currentOverlayList.map((v, idx) => <Line key={v} type="monotone" dataKey={v} name={v} stroke={SERIES_PALETTE[idx % SERIES_PALETTE.length]} strokeWidth={2.2} dot={{ r: 2.5 }} />)}
                    </LineChart>
                  </ResponsiveContainer>
                </div>
              </React.Fragment>
            )}
          </React.Fragment>
        )}

        <p style={{ fontSize: 10.5, color: COLORS.mute, marginTop: 14, lineHeight: 1.6 }}>
          자료: 식약처 수입식품정보마루 히스토리 + 공공데이터포털 실시간 API 병합. 단위 kg → 톤. 매일 자동 갱신됩니다.
        </p>
      </div>
    </div>
  );
}

const thStyle = { textAlign: "left", padding: "8px 10px", fontSize: 10.5, color: "#8f857a", fontWeight: 700, borderBottom: "1px solid #2b2624" };
const tdStyle = { padding: "6px 10px", color: "#f2ead9" };

function SheetTab({ active, onClick, label }) {
  return <button onClick={onClick} style={{ padding: "9px 18px", fontSize: 13.5, fontWeight: 700, cursor: "pointer", background: "none", border: "none", borderBottom: active ? `2px solid ${COLORS.amber}` : "2px solid transparent", color: active ? COLORS.amber : COLORS.mute, marginBottom: -1 }}>{label}</button>;
}
function SubTab({ active, onClick, label }) {
  return <button onClick={onClick} style={{ padding: "6px 12px", borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: "pointer", border: `1px solid ${active ? COLORS.amber : COLORS.panelBorder}`, background: active ? "rgba(217,139,63,0.14)" : COLORS.panel, color: active ? COLORS.amber : COLORS.mute }}>{label}</button>;
}
function ToggleBtn({ active, onClick, label }) {
  return <button onClick={onClick} style={{ padding: "6px 12px", borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: "pointer", border: `1px solid ${active ? COLORS.amber : COLORS.panelBorder}`, background: active ? "rgba(217,139,63,0.14)" : COLORS.panel, color: active ? COLORS.amber : COLORS.mute }}>{label}</button>;
}
function ChipGroup({ label, options, value, onChange }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6, background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 8, padding: "6px 8px" }}>
      <span style={{ fontSize: 11, color: COLORS.mute, paddingLeft: 4 }}>{label}</span>
      {options.map(o => <button key={o} onClick={() => onChange(o)} style={{ padding: "4px 10px", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer", border: "none", background: o === value ? COLORS.amber : "transparent", color: o === value ? "#1a1512" : COLORS.mute }}>{o}</button>)}
    </div>
  );
}
function HoverAxisPicker({ label, value, onChange, options }) {
  const [open, setOpen] = useState(false);
  const timer = useRef(null);
  const enter = () => { if (timer.current) clearTimeout(timer.current); setOpen(true); };
  const leave = () => { timer.current = setTimeout(() => setOpen(false), 150); };
  const found = options.find(([v]) => v === value);
  const currentLabel = found ? found[1] : value;
  return (
    <div onMouseEnter={enter} onMouseLeave={leave} style={{ position: "relative" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 8, padding: "6px 10px" }}>
        <span style={{ fontSize: 11, color: COLORS.mute }}>{label}</span>
        <span style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.amber }}>{currentLabel}</span>
        <span style={{ fontSize: 10, color: COLORS.mute }}>▾</span>
      </div>
      {open && (
        <div style={{ position: "absolute", top: "100%", left: 0, zIndex: 20, background: "#141211", border: `1px solid ${COLORS.panelBorder2}`, borderRadius: 10, padding: 6, minWidth: 130, maxHeight: 280, overflowY: "auto", boxShadow: "0 8px 24px rgba(0,0,0,0.45)" }}>
          {options.map(([v, l]) => (
            <button key={v} onClick={() => { onChange(v); setOpen(false); }} style={{ display: "block", width: "100%", textAlign: "left", padding: "6px 10px", borderRadius: 6, fontSize: 12.5, cursor: "pointer", border: "none", background: v === value ? "rgba(217,139,63,0.18)" : "transparent", color: v === value ? COLORS.amberSoft : COLORS.cream, whiteSpace: "nowrap" }}>{l}</button>
          ))}
        </div>
      )}
    </div>
  );
}
function HoverMultiPicker({ label, options, selected, onToggle, onSelectAll, onClear }) {
  const [open, setOpen] = useState(false);
  const timer = useRef(null);
  const enter = () => { if (timer.current) clearTimeout(timer.current); setOpen(true); };
  const leave = () => { timer.current = setTimeout(() => setOpen(false), 150); };
  return (
    <div onMouseEnter={enter} onMouseLeave={leave} style={{ position: "relative" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, background: COLORS.panel, border: `1px solid ${selected.length ? COLORS.amber : COLORS.panelBorder}`, borderRadius: 8, padding: "6px 12px", color: selected.length ? COLORS.amber : COLORS.mute, fontSize: 12.5, fontWeight: 600 }}>
        {label} {selected.length ? `(${selected.length})` : "전체"} <span style={{ fontSize: 10 }}>▾</span>
      </div>
      {open && (
        <div style={{ position: "absolute", top: "100%", left: 0, zIndex: 20, background: "#141211", border: `1px solid ${COLORS.panelBorder2}`, borderRadius: 10, padding: 10, width: 240, maxHeight: 280, overflowY: "auto", boxShadow: "0 8px 24px rgba(0,0,0,0.45)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
            <span style={{ fontSize: 11, color: COLORS.mute }}>{options.length}개 옵션</span>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={onSelectAll} style={{ fontSize: 11, color: COLORS.sage, background: "none", border: "none", cursor: "pointer", fontWeight: 700 }}>전체 선택</button>
              <button onClick={onClear} style={{ fontSize: 11, color: COLORS.rust, background: "none", border: "none", cursor: "pointer", fontWeight: 700 }}>초기화</button>
            </div>
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
            {options.map(o => (
              <button key={o} onClick={() => onToggle(o)} style={{ padding: "4px 9px", borderRadius: 6, fontSize: 11.5, cursor: "pointer", border: `1px solid ${selected.includes(o) ? COLORS.amber : COLORS.panelBorder2}`, background: selected.includes(o) ? "rgba(217,139,63,0.18)" : "transparent", color: selected.includes(o) ? COLORS.amberSoft : COLORS.mute }}>{o}</button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
