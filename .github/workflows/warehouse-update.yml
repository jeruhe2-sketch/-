name: 창고 재고 데이터 수집 (테스트용 수동실행)

on:
  workflow_dispatch: {}  # 아직 검증 전이라 스케줄 없이 "Run workflow" 버튼으로만 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요 패키지 설치
        run: pip install requests beautifulsoup4

      - name: "[진단] 네트워크 접근성 확인 (IP 차단 여부 확인용)"
        run: |
          mkdir -p debug
          {
            echo "=== GitHub Actions 러너의 공인 IP ==="
            curl -s https://api.ipify.org
            echo ""
            echo "=== [쿠키유지] 대청냉장 login.do GET (로그인폼 원본) ==="
            curl -v --max-time 15 -c /tmp/cookies.txt -b /tmp/cookies.txt -L \
              "http://211.239.173.91:8080/dchdst/" 2>&1
            echo ""
            echo "=== [같은 쿠키로] login.do POST 응답 (실제 계정 + Referer/Origin 헤더 추가) ==="
            curl -v --max-time 15 -c /tmp/cookies.txt -b /tmp/cookies.txt \
              -X POST "http://211.239.173.91:8080/dchdst/login.do" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -H "Referer: http://211.239.173.91:8080/dchdst/login.do" \
              -H "Origin: http://211.239.173.91:8080" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
              -H "Accept-Language: ko-KR,ko;q=0.9,en-US;q=0.8,en;q=0.7" \
              --data-urlencode "id=${NWILL_DAECHEONG_UNCLEARED_ID}" \
              --data-urlencode "pw=${NWILL_DAECHEONG_UNCLEARED_PW}" \
              --data-urlencode "wms_cd=1B6" --data-urlencode "co_stel=031-761-3002" 2>&1
          } > debug/network_check.log 2>&1 || true
        env:
          NWILL_DAECHEONG_UNCLEARED_ID: ${{ secrets.NWILL_DAECHEONG_UNCLEARED_ID }}
          NWILL_DAECHEONG_UNCLEARED_PW: ${{ secrets.NWILL_DAECHEONG_UNCLEARED_PW }}

      - name: 창고 데이터 수집 스크립트 실행
        id: run_script
        continue-on-error: true
        env:
          NWILL_DAECHEONG_UNCLEARED_ID: ${{ secrets.NWILL_DAECHEONG_UNCLEARED_ID }}
          NWILL_DAECHEONG_UNCLEARED_PW: ${{ secrets.NWILL_DAECHEONG_UNCLEARED_PW }}
          NWILL_SINWOO_UNCLEARED_ID: ${{ secrets.NWILL_SINWOO_UNCLEARED_ID }}
          NWILL_SINWOO_UNCLEARED_PW: ${{ secrets.NWILL_SINWOO_UNCLEARED_PW }}
          NWILL_HALLA_CLEARED_ID: ${{ secrets.NWILL_HALLA_CLEARED_ID }}
          NWILL_HALLA_CLEARED_PW: ${{ secrets.NWILL_HALLA_CLEARED_PW }}
          NWILL_HALLA_UNCLEARED_ID: ${{ secrets.NWILL_HALLA_UNCLEARED_ID }}
          NWILL_HALLA_UNCLEARED_PW: ${{ secrets.NWILL_HALLA_UNCLEARED_PW }}
        run: |
          mkdir -p debug
          python scripts/fetch_all_warehouses.py > debug/last_run.log 2>&1
          echo "exit_code=$?" >> debug/last_run.log

      - name: 디버그 로그 및 변경사항 커밋 및 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/warehouse_stock.json debug/last_run.log debug/network_check.log
          git diff --cached --quiet && echo "변경 없음, 커밋 스킵" || git commit -m "chore: 창고 데이터 갱신(테스트) + 디버그 로그 $(date -u +%Y-%m-%d)"
          git push

      - name: 스크립트 실패 시 워크플로우도 실패 처리
        if: steps.run_script.outcome == 'failure'
        run: exit 1
