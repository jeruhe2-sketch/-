name: 매일 데이터 자동 갱신

on:
  schedule:
    # 매일 한국시간 오전 7시 (UTC 기준 전날 22시)
    - cron: '0 22 * * *'
  workflow_dispatch: {}  # "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 데이터 갱신 스크립트 실행
        env:
          OPEN_API_KEY: ${{ secrets.OPEN_API_KEY }}
        run: python scripts/update_data.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/master_flat.json
          git diff --cached --quiet && echo "변경 없음, 커밋 스킵" || git commit -m "chore: 데이터 자동 갱신 $(date -u +%Y-%m-%d)"
          git push
